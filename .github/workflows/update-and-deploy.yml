name: Update CPI data and deploy

on:
  schedule:
    # ONS publishes consumer price inflation figures on a Wednesday morning,
    # usually mid-month. Run every Wednesday at 08:30 UTC; the job only
    # commits and redeploys when the data has actually changed.
    - cron: "30 8 * * 3"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("readr", "dplyr", "tidyr", "purrr", "stringr", "lubridate", "jsonlite"))'

      - name: Refresh CPI data from ONS
        run: Rscript scripts/prepare-cpi-data.R

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/cpi.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new CPI data."
          else
            git commit -m "Update CPI data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        # Always deploy on manual runs and pushes; on the weekly schedule,
        # only when ONS has published new data
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
